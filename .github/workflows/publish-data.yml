# TÜFE verisini günde bir kez TCMB sayfasından okuyup `gh-pages` dalına işler;
# GitHub Pages o daldan yayınlar (Ayarlar → Pages → Source: gh-pages).
#
# Doğrulama başarısız olursa iş HATA verir ve dala hiçbir şey yazılmaz; yayındaki
# son iyi dosya olduğu gibi kalır.
#
# Not: herkese açık depolarda zamanlanmış iş, 60 gün hiç etkinlik olmazsa GitHub
# tarafından kapatılır. "Keep schedule alive" adımı bunu önlemek için gerekirse
# ana dala boş bir commit atar.
name: Publish data

on:
  schedule:
    - cron: "17 6 * * *" # her gün 06:17 UTC (09:17 TR)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      # İki üretici bağımsızdır: biri doğrulamada takılırsa diğeri yine yayınlanır
      # (takılan, eski dosyaya dokunmaz). Son adım yine de işi kırmızı yapar.
      # TÜFE kaynağı TÜİK (SDMX API). Anahtar şifreli secret'tan gelir; günlüklere maskelenir.
      # Doğrulama ya da kimlik doğrulama başarısız olursa dosyaya dokunulmaz ve TCMB'ye
      # geri DÖNÜLMEZ (TCMB'nin ticari kullanım koşulu ayrıdır); yayındaki son iyi dosya kalır.
      - name: Generate tufe.json (TÜİK)
        id: tufe
        continue-on-error: true
        env:
          TUIK_API_KEY: ${{ secrets.TUIK_API_KEY }}
        run: python3 tools/update_tufe_tuik.py pages/tufe.json
      - name: Generate kur.json
        id: kur
        continue-on-error: true
        run: python3 tools/update_kur.py pages/kur.json
      - name: Commit to gh-pages
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tufe.json kur.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Update tufe.json"
            git push
          fi
      - name: Fail if a generator failed
        if: steps.tufe.outcome == 'failure' || steps.kur.outcome == 'failure'
        run: |
          echo "tufe: ${{ steps.tufe.outcome }}, kur: ${{ steps.kur.outcome }}"
          exit 1
      - name: Keep schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep schedule alive"
            git push
          fi
