# TÜFE verisini günde bir kez TCMB sayfasından okuyup GitHub Pages'e yayınlar.
# Doğrulama başarısız olursa iş HATA verir ve yayına gitmez; Pages'teki son iyi dosya kalır.
#
# Not: herkese açık depolarda zamanlanmış iş, 60 gün hiç etkinlik olmazsa GitHub
# tarafından kapatılır. "Keep schedule alive" adımı bunu önlemek için gerekirse
# boş bir commit atar.
name: Publish data

on:
  schedule:
    - cron: "17 6 * * *" # her gün 06:17 UTC (09:17 TR)
  workflow_dispatch:

permissions:
  actions: read # deploy-pages, yüklenen artefaktı listelemek için gerekli
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Generate tufe.json
        run: |
          mkdir -p site
          python3 tools/update_tufe.py site/tufe.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep schedule alive"
            git push
          fi
